name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet restore backend --locked-mode && dotnet build backend --no-restore
      - run: npm ci && npm run build
        working-directory: frontend
      - run: ./scripts/configure.sh && docker compose up -d --build --wait
      - run: ./scripts/test.sh
      - run: node --test mock-external/receiver.test.mjs
      - run: |
          ./scripts/api.sh > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5080/api/health && break || sleep 1; done
          ./scripts/http-tests.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics
          path: /tmp/api.log

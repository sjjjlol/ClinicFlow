name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test
        working-directory: agent-runtime
      - run: dotnet restore backend --locked-mode && dotnet build backend --no-restore
      - run: npm ci && npm run build
        working-directory: frontend
      - run: ./scripts/configure.sh && docker compose up -d --build --wait
      - run: dotnet restore tests --locked-mode
      - run: ./scripts/test.sh --no-restore
      - run: node --test mock-external/receiver.test.mjs
      - run: |
          ./scripts/api.sh > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5080/api/health && break || sleep 1; done
          ./scripts/http-tests.sh
      - run: |
          set -a
          source .env
          set +a
          node tests/http-integration.mjs
      - run: ./scripts/upgrade-drill.sh
      - run: ./scripts/labs.sh L1 && ./scripts/labs.sh L1 --fixed && ./scripts/labs.sh L2 && ./scripts/labs.sh L2 --fixed && ./scripts/labs.sh L3 10000
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          set -a
          source .env
          set +a
          npm --prefix frontend run dev > /tmp/ui.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173 >/dev/null && break || sleep 1; done
          npm --prefix frontend run test:e2e
      - run: |
          dotnet publish backend -c Release -o artifacts/app
          cp -R frontend/dist artifacts/app/wwwroot
          cp -R agent-runtime artifacts/app/agent-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: clinicflow-portable
          path: artifacts/app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics
          path: |
            /tmp/api.log
            /tmp/ui.log
            frontend/test-results
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - name: Start from fresh volumes with the documented command
        run: ./scripts/start.sh
      - name: Verify the container API, seeds and bundled UI
        run: |
          curl -fsS http://127.0.0.1:5080/ | grep 'ClinicFlow'
          ./scripts/http-tests.sh
      - name: Container diagnostics
        if: failure()
        run: docker compose --profile full logs --tail 150
